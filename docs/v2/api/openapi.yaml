openapi: 3.1.0
info:
  title: Porto Padel League API v2
  version: 0.1.0
  description: |
    Contract v0 for the v2 data model (docs/v2/APP_MIGRATION_PLAN.md, section 4).
    Owner: S0. Sessions request changes; S0 edits this file and regenerates
    `padel_league_frontend/src/api/v2/schema.d.ts`.

    Conventions
    - camelCase JSON; ids are integers and preserved from v1 (division id = group id).
    - Points and other computed numbers are **unrounded**; the frontend rounds for display.
    - GET never writes. Errors are `{error, code}`.
    - Auth: `Authorization: Bearer <access token>` (30 min); renew with POST /auth/refresh
      using the refresh token (30 days). Roles: player | admin | super_admin.
    - Dates are ISO 8601; datetimes are UTC with a trailing Z.
servers:
  - url: /api/v2
security: []
tags:
  - name: competitions
  - name: groups
  - name: matches
  - name: players
  - name: rankings
  - name: teams
  - name: auth
  - name: admin

paths:
  /seasons:
    get:
      tags: [competitions]
      summary: Seasons, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Season" } }

  /competitions:
    get:
      tags: [competitions]
      summary: Competition cards for the Tournaments page
      description: Grouped by season on the client; ordered current season first, then by start date descending.
      parameters:
        - { name: season, in: query, schema: { type: integer }, description: season id }
        - { name: format, in: query, schema: { $ref: "#/components/schemas/Format" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/CompetitionStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CompetitionCard" } }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Create a competition (Clássica from the previous one via promotion, Shuffle, Teams)
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompetitionCreate" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Competition" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/preview:
    post:
      tags: [admin]
      summary: Dry run of POST /competitions — the groups and members it would create, nothing saved
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompetitionCreate" }
      responses:
        "200":
          description: Proposed groups
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      required: [name, tier, rating, players]
                      properties:
                        name: { type: string }
                        tier: { type: integer }
                        rating: { type: number }
                        players: { type: array, items: { $ref: "#/components/schemas/PlayerRef" } }
                  notes: { type: array, items: { type: string }, description: Promotion decisions worth showing (withdrawals filled, contests won on appearances) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/current:
    get:
      tags: [competitions]
      summary: The current competition of a format (target of the /shuffle and /teams redirects)
      parameters:
        - { name: format, in: query, required: true, schema: { $ref: "#/components/schemas/Format" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CompetitionCard" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}:
    parameters: [{ $ref: "#/components/parameters/competitionId" }]
    get:
      tags: [competitions]
      summary: Competition page (stages, groups, rules)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Competition" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/fixtures:
    parameters: [{ $ref: "#/components/parameters/competitionId" }]
    post:
      tags: [admin]
      summary: Generate the fixtures of every group of a stage
      security: [{ bearer: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stageId: { type: integer }
                firstRoundDate: { type: string, format: date }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Competition" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/rounds:
    parameters: [{ $ref: "#/components/parameters/competitionId" }]
    post:
      tags: [admin]
      summary: Shuffle — generate the next round (groups from the standings)
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Competition" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Shuffle — delete the last (unplayed) round
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Competition" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/standings:
    parameters: [{ $ref: "#/components/parameters/competitionId" }]
    get:
      tags: [competitions]
      summary: Competition-level standings (Shuffle overall; Teams edition total = sum of mini-tournament points)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StandingRow" } }
        "404": { $ref: "#/components/responses/Error" }

  /groups/{groupId}:
    parameters: [{ $ref: "#/components/parameters/groupId" }]
    get:
      tags: [groups]
      summary: Group page — members, standings, rounds (v1 tournament page)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GroupDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /groups/{groupId}/matches:
    parameters: [{ $ref: "#/components/parameters/groupId" }]
    get:
      tags: [groups]
      parameters:
        - { name: round, in: query, schema: { type: integer }, description: round number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Match" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /groups/{groupId}/close:
    parameters: [{ $ref: "#/components/parameters/groupId" }]
    post:
      tags: [admin]
      summary: Freeze standings, write awards, refresh the ranking
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GroupDetail" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /matches/{matchId}:
    parameters: [{ $ref: "#/components/parameters/matchId" }]
    get:
      tags: [matches]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Match" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /matches/{matchId}/result:
    parameters: [{ $ref: "#/components/parameters/matchId" }]
    put:
      tags: [matches]
      summary: Record a result (any signed-in player)
      description: |
        Clássica / Shuffle send one set with the games. Teams send exactly 3 sets,
        each `completed`, `timeout_draw` or `not_started`; a walkover sends no sets and `walkoverWinner` (Teams: 3-0).
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultInput" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Match" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /rounds/{roundId}/absences:
    parameters: [{ name: roundId, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [matches]
      summary: Mark a player absent for a round, optionally naming the substitute
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerId, groupId]
              properties:
                playerId: { type: integer }
                groupId: { type: integer }
                substitutePlayerId: { type: [integer, "null"] }
                kind: { type: string, enum: [full, partial], default: full }
                matchIds: { type: array, items: { type: integer }, description: "kind=partial: the matches the player misses (required for partial)" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Absence" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /absences/{absenceId}:
    parameters: [{ name: absenceId, in: path, required: true, schema: { type: integer } }]
    delete:
      tags: [matches]
      security: [{ bearer: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /calendar:
    get:
      tags: [matches]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: group, in: query, schema: { type: integer } }
        - { name: competition, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Match" } }
        "400": { $ref: "#/components/responses/Error" }

  /players:
    get:
      tags: [players]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PlayerSummary" } }

  /players/compare:
    get:
      tags: [players]
      parameters:
        - { name: a, in: query, required: true, schema: { type: integer } }
        - { name: b, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerComparison" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /players/{playerId}:
    parameters: [{ $ref: "#/components/parameters/playerId" }]
    get:
      tags: [players]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /players/{playerId}/matches:
    parameters: [{ $ref: "#/components/parameters/playerId" }]
    get:
      tags: [players]
      parameters:
        - { name: competition, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Match" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /players/{playerId}/story:
    parameters: [{ $ref: "#/components/parameters/playerId" }]
    get:
      tags: [players]
      summary: The new player page's blocks (J1-J7) computed live; every sentence is a fixed template (services/player_story.py)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlayerStory" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /players/{playerId}/badges:
    parameters: [{ $ref: "#/components/parameters/playerId" }]
    get:
      tags: [players]
      summary: The player's conquistas (earned rarest first, then locked with progress); null for a player without games
      responses:
        "200": { description: OK, content: { application/json: { schema: { oneOf: [{ $ref: "#/components/schemas/PlayerBadges" }, { type: "null" }] } } } }
        "404": { $ref: "#/components/responses/Error" }

  /badges:
    get:
      tags: [players]
      summary: Every conquista with its rule, rarity and holders, rarest first (registry in services/badges.py)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BadgeCatalogue" } } } }

  /badges/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    get:
      tags: [players]
      summary: One conquista with its holders and the players closest to earning it
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BadgeDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /rankings/current:
    get:
      tags: [rankings]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Ranking" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /rankings/subs:
    get:
      tags: [rankings]
      summary: Substitutes ranking (points as a sub in the ranking window × division multiplier)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SubsRanking" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /rankings/{snapshotId}:
    parameters: [{ name: snapshotId, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [rankings]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Ranking" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /rankings/players/{playerId}:
    parameters: [{ $ref: "#/components/parameters/playerId" }]
    get:
      tags: [rankings]
      summary: Why a player has their points — one line per counted or dropped award
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RankingExplanation" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/teams:
    parameters: [{ $ref: "#/components/parameters/competitionId" }]
    get:
      tags: [teams]
      summary: Teams pair choice state for the current mini-tournament (same shape as v1 /teams/)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamsState" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/teams/projection:
    parameters: [{ $ref: "#/components/parameters/competitionId" }]
    get:
      tags: [teams]
      summary: Projected divisions for the current mini-tournament (what close + form divisions would produce now)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamsProjection" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/teams/simulate:
    parameters: [{ $ref: "#/components/parameters/competitionId" }]
    get:
      tags: [teams]
      summary: Partner simulator (where would player + partner land)
      parameters:
        - { name: player, in: query, schema: { type: integer }, description: defaults to the signed-in user's player }
        - { name: partner, in: query, schema: { type: integer }, description: omitted = no declaration (paired by ranking) }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamsSimulation" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/partner-requests:
    parameters: [{ $ref: "#/components/parameters/competitionId" }]
    post:
      tags: [teams]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [partnerId], properties: { partnerId: { type: integer } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamsState" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [teams]
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamsState" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/pairs:
    parameters: [{ $ref: "#/components/parameters/competitionId" }]
    post:
      tags: [teams, admin]
      summary: Admin forms a pair by hand
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playerIds]
              properties: { playerIds: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamsState" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/pairs/{pairId}:
    parameters:
      - { $ref: "#/components/parameters/competitionId" }
      - { name: pairId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [teams, admin]
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamsState" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/pairs/close:
    parameters: [{ $ref: "#/components/parameters/competitionId" }]
    post:
      tags: [teams, admin]
      summary: Pair everyone left by ranking (nearest allowed partner) and close the pairs
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamsState" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /competitions/{competitionId}/roster/{playerId}:
    parameters:
      - { $ref: "#/components/parameters/competitionId" }
      - { $ref: "#/components/parameters/playerId" }
    post:
      tags: [admin]
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamsState" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TeamsState" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /stages/{stageId}/divisions:
    parameters: [{ name: stageId, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [teams, admin]
      summary: Teams — form the divisions of a mini-tournament (pairs by summed ranking points, 4 per division)
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Stage" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /news:
    get:
      tags: [news]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/NewsSummary" } } } } }

  /news/latest:
    get:
      tags: [news]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NewsDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /news/{newsId}:
    parameters: [{ name: newsId, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [news]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NewsDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /sponsors:
    get:
      tags: [site]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Sponsor" } } } } }

  /auth/login:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties: { username: { type: string }, password: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Error" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange the refresh token (sent as Bearer) for a new token pair
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "401": { $ref: "#/components/responses/Error" }

  /auth/me:
    get:
      tags: [auth]
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/User" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/password-codes:
    get:
      tags: [auth]
      summary: Pending password codes (admin). A code is pending from a player's forgot-password request or an admin's POST until it is used, dies after 5 wrong tries, or is dismissed.
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PasswordCode" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: The pending code for a player's account, made if there is none (admin). Sent to the player by WhatsApp.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [playerId], properties: { playerId: { type: integer } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PasswordCode" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /admin/password-codes/{userId}:
    delete:
      tags: [auth]
      summary: Dismiss a pending code (admin)
      security: [{ bearer: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Dismissed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    competitionId: { name: competitionId, in: path, required: true, schema: { type: integer } }
    groupId: { name: groupId, in: path, required: true, schema: { type: integer } }
    matchId: { name: matchId, in: path, required: true, schema: { type: integer } }
    playerId: { name: playerId, in: path, required: true, schema: { type: integer } }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Message shown to the user (Portuguese) }
        code: { type: string, description: Stable machine code, e.g. pairing_closed }

    Format: { type: string, enum: [classica, teams, shuffle, super_cup] }
    CompetitionStatus: { type: string, enum: [upcoming, live, ended] }
    Role: { type: string, enum: [player, admin, super_admin] }

    Season:
      type: object
      required: [id, name, isCurrent]
      properties:
        id: { type: integer }
        name: { type: string, examples: ["2026/27"] }
        startsOn: { type: [string, "null"], format: date }
        endsOn: { type: [string, "null"], format: date }
        isCurrent: { type: boolean }

    Image:
      type: [object, "null"]
      properties:
        url: { type: string }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }

    CompetitionCard:
      type: object
      description: Everything a Tournaments-page card needs.
      required: [id, name, label, editionNumber, format, season, status, groupCount]
      properties:
        id: { type: integer }
        name: { type: string, examples: ["22ª Edição", "16ª Edição Powered by QSC"] }
        title: { type: [string, "null"], description: "Tournament name when it is not a Classic's season, e.g. Shuffle 2026" }
        editionNumber: { type: [integer, "null"], description: The running edition number across every format (null for the 2022 Play Off); lists sort on it, newest first }
        label: { type: string, examples: ["22ª Edição - Outono 2026", "20ª Edição - Shuffle 2026", "23ª Edição - Teams 2026/27"], description: "The display name: <Nª Edição> - <tournament>, no sponsor" }
        format: { $ref: "#/components/schemas/Format" }
        formatLabel: { type: string, examples: ["Classic", "Teams", "Shuffle", "Super Cup"] }
        eventSlot: { type: [string, "null"], examples: ["classica-1"], description: Recurring event key }
        season: { $ref: "#/components/schemas/Season" }
        status: { $ref: "#/components/schemas/CompetitionStatus" }
        startsOn: { type: [string, "null"], format: date }
        endsOn: { type: [string, "null"], format: date }
        groupCount: { type: integer, description: Groups in the current/last stage (divisions) }
        playerCount: { type: integer }
        coverImage: { $ref: "#/components/schemas/Image" }
        bannerImage: { $ref: "#/components/schemas/Image" }
        legacyEditionId: { type: [integer, "null"], description: v1 edition id when the competition was an edition }

    Competition:
      allOf:
        - $ref: "#/components/schemas/CompetitionCard"
        - type: object
          required: [stages, rules]
          properties:
            rules: { type: object, additionalProperties: true }
            stages: { type: array, items: { $ref: "#/components/schemas/Stage" } }
            currentStageId: { type: [integer, "null"] }

    CompetitionCreate:
      type: object
      required: [format, seasonId]
      properties:
        format: { $ref: "#/components/schemas/Format" }
        name: { type: string }
        seasonId: { type: integer }
        eventSlot: { type: [string, "null"] }
        startsOn: { type: string, format: date }
        fromCompetitionId: { type: [integer, "null"], description: Clássica built from the previous one via promotion }
        withdrawals: { type: array, items: { type: integer } }
        newPlayerIds: { type: array, items: { type: integer } }
        placedNewPlayers: { type: object, additionalProperties: { type: array, items: { type: integer } }, description: "tier → newcomer ids placed straight into that division (Golden Ticket)" }
        playerIds: { type: array, items: { type: integer }, description: Shuffle / Teams roster }

    Stage:
      type: object
      required: [id, number, status, groups, rounds]
      properties:
        id: { type: integer }
        number: { type: integer }
        name: { type: [string, "null"], examples: ["Mini-torneio 1"] }
        status: { type: string, enum: [planned, running, ended] }
        emitsAward: { type: boolean }
        pairingDeadline: { type: [string, "null"], format: date-time }
        pairingClosed: { type: boolean }
        groups: { type: array, items: { $ref: "#/components/schemas/GroupSummary" } }
        rounds: { type: array, items: { $ref: "#/components/schemas/Round" } }

    Round:
      type: object
      required: [id, number]
      properties:
        id: { type: integer }
        number: { type: integer }
        date: { type: [string, "null"], format: date }

    GroupSummary:
      type: object
      required: [id, name, tier]
      properties:
        id: { type: integer, description: Equals the v1 division id for migrated groups }
        name: { type: string }
        tier: { type: [integer, "null"] }
        rating: { type: [number, "null"] }
        hasEnded: { type: boolean }
        logoImage: { $ref: "#/components/schemas/Image" }
        bannerImage: { $ref: "#/components/schemas/Image" }

    GroupDetail:
      allOf:
        - $ref: "#/components/schemas/GroupSummary"
        - type: object
          required: [competition, stage, members, standings, rounds]
          properties:
            competition: { $ref: "#/components/schemas/CompetitionCard" }
            stage: { type: object, properties: { id: { type: integer }, number: { type: integer }, name: { type: [string, "null"] } } }
            members: { type: array, items: { $ref: "#/components/schemas/PlayerRef" } }
            standings: { type: array, items: { $ref: "#/components/schemas/StandingRow" } }
            standingsFrozen: { type: boolean, description: true when read from standing_snapshots }
            rounds: { type: array, items: { $ref: "#/components/schemas/Round" } }
            currentRound: { type: [integer, "null"] }
            lastPlayedMatches: { type: array, items: { $ref: "#/components/schemas/Match" } }

    StandingRow:
      type: object
      required: [place, player, points, played]
      properties:
        place: { type: integer, description: Ties share the place (Teams) }
        player: { $ref: "#/components/schemas/PlayerRef" }
        points: { type: number, description: Competition points (Clássica match points, Teams set points) }
        played: { type: integer, description: Appearances (presenças) }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }
        gamesWon: { type: [integer, "null"] }
        gamesLost: { type: [integer, "null"] }
        setsWon: { type: [integer, "null"], description: Teams }
        setsDrawn: { type: [integer, "null"], description: Teams }
        attendancePct: { type: [number, "null"] }
        rankingPlacePoints: { type: [number, "null"], description: Award place points once awarded / projected }
        rankingBonusPoints: { type: [number, "null"] }
        nextGroupTier: { type: [integer, "null"], description: Shuffle next placement }
        stages:
          type: array
          description: Competition standings only — per stage (Teams mini-tournament / Shuffle round) breakdown
          items:
            type: object
            required: [stageNumber]
            properties:
              stageNumber: { type: integer }
              groupId: { type: [integer, "null"] }
              tier: { type: [integer, "null"] }
              place: { type: [integer, "null"] }
              points: { type: [number, "null"], description: Ranking points awarded for that stage (null while its group is live) }
              setPoints: { type: [number, "null"], description: Teams set points in that mini-tournament }

    PasswordCode:
      type: object
      required: [userId, username, player, code]
      properties:
        userId: { type: integer }
        username: { type: string }
        player: { oneOf: [{ $ref: "#/components/schemas/PlayerRef" }, { type: "null" }] }
        code: { type: string, description: "5 digits; the player types it at /verify-code/<userId>" }

    PlayerRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        fullName: { type: [string, "null"] }
        pictureUrl: { type: [string, "null"] }

    Participant:
      type: object
      required: [side, slot, role]
      properties:
        side: { type: string, enum: [home, away] }
        slot: { type: integer, enum: [1, 2] }
        role: { type: string, enum: [member, substitute, unknown] }
        player: { oneOf: [{ $ref: "#/components/schemas/PlayerRef" }, { type: "null" }], description: null when an unknown substitute played }

    MatchSet:
      type: object
      required: [setNo, outcome]
      properties:
        setNo: { type: integer }
        homeGames: { type: [integer, "null"] }
        awayGames: { type: [integer, "null"] }
        outcome: { type: string, enum: [completed, timeout_draw, not_started], description: "completed = played to a winner, games required and different; timeout_draw = in progress at time-out (games optional); not_started = never started. Teams scores timeout_draw and not_started as a drawn set (1 point each)." }

    Match:
      type: object
      required: [id, groupId, round, status, participants, sets]
      properties:
        id: { type: integer }
        groupId: { type: integer }
        groupName: { type: [string, "null"] }
        competitionId: { type: integer }
        format: { $ref: "#/components/schemas/Format" }
        round: { type: integer }
        scheduledAt: { type: [string, "null"], format: date-time }
        court: { type: [string, "null"] }
        status: { type: string, enum: [scheduled, played, walkover, cancelled] }
        participants: { type: array, items: { $ref: "#/components/schemas/Participant" } }
        sets: { type: array, items: { $ref: "#/components/schemas/MatchSet" } }
        homeScore: { type: [number, "null"], description: Games (Clássica/Shuffle) or set points (Teams) }
        awayScore: { type: [number, "null"] }
        winner: { type: [string, "null"], enum: [home, away, draw, null] }
        absences: { type: array, items: { $ref: "#/components/schemas/Absence" } }

    ResultInput:
      type: object
      required: [sets]
      properties:
        sets:
          type: array
          minItems: 0
          maxItems: 3
          description: Teams requires exactly 3 unless walkoverWinner is set; Clássica/Shuffle send one set with the games.
          items:
            type: object
            required: [outcome]
            properties:
              homeGames: { type: [integer, "null"] }
              awayGames: { type: [integer, "null"] }
              outcome: { type: string, enum: [completed, timeout_draw, not_started], description: "completed = played to a winner, games required and different; timeout_draw = in progress at time-out (games optional); not_started = never started. Teams scores timeout_draw and not_started as a drawn set (1 point each)." }
        walkoverWinner: { type: [string, "null"], enum: [home, away, null] }
        court: { type: [string, "null"] }

    Absence:
      type: object
      required: [id, roundId, player, kind, source]
      properties:
        id: { type: integer }
        roundId: { type: integer }
        groupId: { type: integer }
        player: { $ref: "#/components/schemas/PlayerRef" }
        substitute: { oneOf: [{ $ref: "#/components/schemas/PlayerRef" }, { type: "null" }] }
        kind: { type: string, enum: [full, partial] }
        source: { type: string, enum: [derived, recorded] }
        recordedBy: { oneOf: [{ $ref: "#/components/schemas/PlayerRef" }, { type: "null" }], description: Who marked it (from audit_events); null for derived history }
        recordedAt: { type: [string, "null"], format: date-time }

    PlayerSummary:
      allOf:
        - $ref: "#/components/schemas/PlayerRef"
        - type: object
          properties:
            rankingPosition: { type: [integer, "null"] }
            rankingPoints: { type: number }
            status: { type: string, enum: [active, inactive, substitute] }

    PlayerDetail:
      allOf:
        - $ref: "#/components/schemas/PlayerSummary"
        - type: object
          properties:
            largePictureUrl: { type: [string, "null"] }
            preferredHand: { type: [string, "null"] }
            preferredPosition: { type: [string, "null"] }
            height: { type: [number, "null"] }
            birthDate: { type: [string, "null"], format: date }
            substituteMatches:
              type: array
              description: Matches played as a substitute, newest first (not counted in member stats)
              items: { $ref: "#/components/schemas/Match" }
            history:
              type: array
              description: One row per competition entry, newest edition first
              items:
                type: object
                required: [competition, label]
                properties:
                  competition: { $ref: "#/components/schemas/CompetitionCard" }
                  label: { type: string, examples: ["21ª Edição - Primavera 2026 - 5ª Divisão", "20ª Edição - Shuffle 2026"], description: "Classic: the edition and division; other formats: the competition label" }
                  groupId: { type: [integer, "null"], description: The Classic division (null for Shuffle/Teams rows, which cover the whole competition) }
                  groupName: { type: [string, "null"] }
                  place: { type: [integer, "null"] }
                  points: { type: [number, "null"] }
                  played: { type: [integer, "null"] }
                  wins: { type: [integer, "null"] }
                  draws: { type: [integer, "null"] }
                  losses: { type: [integer, "null"] }
                  awardPoints: { type: [number, "null"] }
            stats:
              type: object
              additionalProperties: { type: number }

    StoryLine:
      type: object
      required: [key, text]
      description: One sentence from the copy catalogue (key) filled with live numbers (text)
      properties:
        key: { type: string }
        text: { type: string }

    StoryRecord:
      type: object
      required: [played, wins, draws, losses]
      properties:
        played: { type: integer }
        wins: { type: integer }
        draws: { type: integer }
        losses: { type: integer }

    StoryRing:
      type: object
      required: [competitionId, edition, format, title, matches]
      description: One fingerprint ring = one edition; matches are [margin, matchId] in game order (corrupt scores and walkovers left out)
      properties:
        competitionId: { type: integer }
        edition: { type: string, examples: ["5ª"] }
        format: { type: string }
        tier: { type: [integer, "null"] }
        place: { type: [integer, "null"] }
        title: { type: boolean }
        matches: { type: array, items: { type: array, items: { type: integer } } }

    StoryOpponent:
      allOf:
        - $ref: "#/components/schemas/StoryRecord"
        - type: object
          required: [player, diff]
          properties:
            player: { $ref: "#/components/schemas/PlayerRef" }
            diff: { type: integer, description: games won minus lost against them }
            lossStreak: { type: integer }
            gamesLine: { $ref: "#/components/schemas/StoryLine" }

    Badge:
      type: object
      required: [key, name, rule, kind, holdersCount, rarityPct, tier, tierLabel, rarityLine]
      properties:
        key: { type: string }
        name: { type: string }
        rule: { type: string }
        kind: { type: string, enum: [at_least, at_most, leader] }
        target: { type: [number, "null"] }
        holdersCount: { type: integer }
        rarityPct: { type: number, description: share of players with at least one game who own it }
        tier: { type: string, enum: [comum, rara, epica, lendaria] }
        tierLabel: { type: string }
        rarityLine: { $ref: "#/components/schemas/StoryLine" }

    PlayerBadge:
      allOf:
        - $ref: "#/components/schemas/Badge"
        - type: object
          required: [earned]
          properties:
            earned: { type: boolean }
            value: { type: [number, "null"] }
            fraction: { type: [number, "null"], description: progress 0..1 for count badges }
            progress: { oneOf: [{ $ref: "#/components/schemas/StoryLine" }, { type: "null" }] }

    PlayerBadges:
      type: object
      required: [earned, total, countLine, info, items]
      properties:
        earned: { type: integer }
        total: { type: integer }
        countLine: { $ref: "#/components/schemas/StoryLine" }
        info: { $ref: "#/components/schemas/StoryLine" }
        items: { type: array, items: { $ref: "#/components/schemas/PlayerBadge" } }

    BadgeCatalogue:
      type: object
      required: [playersCount, info, badges]
      properties:
        playersCount: { type: integer }
        info: { $ref: "#/components/schemas/StoryLine" }
        badges:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Badge"
              - type: object
                required: [holders]
                properties:
                  holders: { type: array, items: { $ref: "#/components/schemas/PlayerRef" } }

    BadgeDetail:
      allOf:
        - $ref: "#/components/schemas/Badge"
        - type: object
          required: [playersCount, holders, closest]
          properties:
            playersCount: { type: integer }
            holders: { type: array, items: { $ref: "#/components/schemas/PlayerRef" } }
            closest:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/PlayerBadge"
                  - type: object
                    required: [player]
                    properties:
                      player: { $ref: "#/components/schemas/PlayerRef" }

    PlayerStory:
      type: object
      required: [playerId, today, hero]
      properties:
        playerId: { type: integer }
        today: { type: string, format: date }
        hero:
          type: object
          required: [editions, titles]
          properties:
            since: { type: [string, "null"], format: date }
            editions: { type: integer }
            titles: { type: integer }
            line: { oneOf: [{ $ref: "#/components/schemas/StoryLine" }, { type: "null" }] }
            tableNote: { oneOf: [{ $ref: "#/components/schemas/StoryLine" }, { type: "null" }] }
            pointsLine: { oneOf: [{ $ref: "#/components/schemas/StoryLine" }, { type: "null" }] }
        archetype:
          type: [object, "null"]
          required: [line, matches, skyline, traits]
          description: key/name null until the player has the minimum number of matches (line says how many are missing)
          properties:
            key: { type: [string, "null"] }
            name: { type: [string, "null"] }
            line: { $ref: "#/components/schemas/StoryLine" }
            matches: { type: integer }
            skyline: { type: array, items: { type: integer }, description: "21 counts of margins -10..+10 (clipped)" }
            traits:
              type: object
              properties:
                tight: { type: object, properties: { won: { type: integer }, total: { type: integer }, pct: { type: [integer, "null"] }, line: { $ref: "#/components/schemas/StoryLine" } } }
                diesel: { type: [array, "null"], items: { type: integer } }
                perfectNights: { type: integer }
                comebacks: { type: integer }
                nightsOfThree: { type: integer }
                bigWins: { type: integer }
        fingerprint:
          type: [object, "null"]
          required: [rings, excluded]
          properties:
            rings: { type: array, items: { $ref: "#/components/schemas/StoryRing" } }
            excluded: { type: integer }
            next: { type: [object, "null"], properties: { edition: { type: string }, label: { type: string } } }
            note: { $ref: "#/components/schemas/StoryLine" }
            caption: { $ref: "#/components/schemas/StoryLine" }
        mountain:
          type: [object, "null"]
          required: [title, lede, points]
          properties:
            title: { $ref: "#/components/schemas/StoryLine" }
            lede: { $ref: "#/components/schemas/StoryLine" }
            ups: { type: integer }
            downs: { type: integer }
            next: { type: [object, "null"], properties: { edition: { type: string }, label: { type: string } } }
            points:
              type: array
              items:
                type: object
                required: [competitionId, edition, label, format]
                properties:
                  competitionId: { type: integer }
                  edition: { type: string }
                  label: { type: string }
                  format: { type: string }
                  tier: { type: [integer, "null"] }
                  place: { type: [integer, "null"] }
                  position: { type: [integer, "null"], description: members of the higher divisions of that edition + place }
                  topSize: { type: [integer, "null"], description: members of the 1ª Divisão that edition }
                  title: { type: boolean }
                  change: { type: [string, "null"], enum: [up, down, null] }
        people:
          type: [object, "null"]
          required: [title, clientes]
          properties:
            title: { $ref: "#/components/schemas/StoryLine" }
            carrasco: { oneOf: [{ $ref: "#/components/schemas/StoryOpponent" }, { type: "null" }] }
            clientes: { type: array, items: { $ref: "#/components/schemas/StoryOpponent" } }
            carrascoLine: { oneOf: [{ $ref: "#/components/schemas/StoryLine" }, { type: "null" }] }
            clientesLine: { oneOf: [{ $ref: "#/components/schemas/StoryLine" }, { type: "null" }] }
            paradox: { oneOf: [{ $ref: "#/components/schemas/StoryLine" }, { type: "null" }] }
        constellation:
          type: [object, "null"]
          required: [title, lede, partners, opponents, met, total, degree2, degree3]
          properties:
            title: { $ref: "#/components/schemas/StoryLine" }
            lede: { $ref: "#/components/schemas/StoryLine" }
            partners:
              type: array
              items:
                type: object
                required: [player, together, chemistry]
                properties:
                  player: { $ref: "#/components/schemas/PlayerRef" }
                  together: { type: integer }
                  chemistry: { type: integer, description: win% together minus the player's overall win% (0 below the minimum) }
            opponents:
              type: array
              items: { type: object, required: [player, met], properties: { player: { $ref: "#/components/schemas/PlayerRef" }, met: { type: integer } } }
            strangers:
              type: [object, "null"]
              properties:
                count: { type: integer }
                competitionLabel: { type: string }
                title: { $ref: "#/components/schemas/StoryLine" }
                lede: { $ref: "#/components/schemas/StoryLine" }
                list:
                  type: array
                  items:
                    type: object
                    properties:
                      player: { $ref: "#/components/schemas/PlayerRef" }
                      matches: { type: integer }
                      bridge: { oneOf: [{ $ref: "#/components/schemas/PlayerRef" }, { type: "null" }] }
                      line: { $ref: "#/components/schemas/StoryLine" }
            met: { type: integer }
            total: { type: integer }
            totalLine: { $ref: "#/components/schemas/StoryLine" }
            degree2: { type: integer }
            degree3: { type: integer }
            rivalId: { type: [integer, "null"] }
            carrascoId: { type: [integer, "null"] }
        rival:
          oneOf:
            - type: "null"
            - allOf:
                - $ref: "#/components/schemas/StoryRecord"
                - type: object
                  required: [player, title, together, rings, titles]
                  properties:
                    player: { $ref: "#/components/schemas/PlayerRef" }
                    title: { $ref: "#/components/schemas/StoryLine" }
                    together: { $ref: "#/components/schemas/StoryRecord" }
                    togetherLine: { oneOf: [{ $ref: "#/components/schemas/StoryLine" }, { type: "null" }] }
                    split: { type: array, items: { $ref: "#/components/schemas/StoryLine" }, description: "wins, draws · played, losses" }
                    rings: { type: array, items: { $ref: "#/components/schemas/StoryRing" } }
                    titles: { type: integer }
                    caption: { $ref: "#/components/schemas/StoryLine" }
        nights:
          type: [object, "null"]
          required: [title, lede, played, missed, cells]
          properties:
            title: { $ref: "#/components/schemas/StoryLine" }
            lede: { $ref: "#/components/schemas/StoryLine" }
            played: { type: integer }
            missed: { type: integer }
            cells:
              type: array
              items:
                type: object
                required: [date, played, estimated, competitionId, round]
                properties:
                  date: { type: string, format: date }
                  net: { type: [integer, "null"] }
                  played: { type: boolean }
                  estimated: { type: boolean }
                  competitionId: { type: integer }
                  round: { type: integer }
            best:
              type: [object, "null"]
              properties:
                date: { type: string, format: date }
                net: { type: integer }
                label: { type: string }
                scores: { type: array, items: { type: string } }
                line: { $ref: "#/components/schemas/StoryLine" }
            next:
              type: [object, "null"]
              properties:
                date: { type: string, format: date }
                competitionId: { type: integer }
                line: { $ref: "#/components/schemas/StoryLine" }
            estimatedNote: { oneOf: [{ $ref: "#/components/schemas/StoryLine" }, { type: "null" }] }
        badges: { oneOf: [{ $ref: "#/components/schemas/PlayerBadges" }, { type: "null" }] }
        streaks:
          type: [object, "null"]
          required: [title, items]
          properties:
            title: { $ref: "#/components/schemas/StoryLine" }
            items:
              type: array
              items:
                type: object
                required: [key, label, current, best, record, alive, line]
                properties:
                  key: { type: string, enum: [podiums, wins, nights] }
                  label: { type: string }
                  current: { type: integer }
                  best: { type: integer }
                  record: { type: integer }
                  alive: { type: boolean }
                  line: { $ref: "#/components/schemas/StoryLine" }

    PlayerComparison:
      type: object
      properties:
        a: { $ref: "#/components/schemas/PlayerSummary" }
        b: { $ref: "#/components/schemas/PlayerSummary" }
        headToHead: { type: object, properties: { played: { type: integer }, aWins: { type: integer }, bWins: { type: integer }, draws: { type: integer } } }
        together: { type: object, properties: { played: { type: integer }, wins: { type: integer }, draws: { type: integer }, losses: { type: integer } } }
        matches: { type: array, items: { $ref: "#/components/schemas/Match" } }

    Ranking:
      type: object
      required: [snapshotId, rule, computedAt, entries]
      properties:
        snapshotId: { type: integer }
        rule: { type: object, properties: { key: { type: string }, name: { type: string } } }
        computedAt: { type: string, format: date-time }
        entries:
          type: array
          items:
            type: object
            required: [position, player, points]
            properties:
              position: { type: integer }
              player: { $ref: "#/components/schemas/PlayerRef" }
              points: { type: number, description: Unrounded }
              previousPosition: { type: [integer, "null"] }
              fromSubs: { type: boolean, description: "Art. 12: a new player whose points come from substitute appearances" }

    SubsRanking:
      type: object
      required: [entries]
      properties:
        computedAt: { type: [string, "null"], format: date-time }
        competitions:
          type: array
          description: The competitions in the ranking window the subs points come from (same window as the main ranking), newest edition first
          items: { type: object, required: [id, name, label], properties: { id: { type: integer }, name: { type: string }, label: { type: string, examples: ["22ª Edição - Outono 2026"] } } }
        entries:
          type: array
          items:
            type: object
            required: [position, player, points, appearances, isExternal]
            properties:
              position: { type: integer }
              player: { $ref: "#/components/schemas/PlayerRef" }
              points: { type: number, description: "Sum of substitute points × division multiplier (1ª×10 … 6ª×3)" }
              appearances: { type: integer }
              isExternal: { type: boolean }

    RankingExplanation:
      type: object
      properties:
        player: { $ref: "#/components/schemas/PlayerRef" }
        total: { type: number }
        lines:
          type: array
          items:
            type: object
            properties:
              competition: { $ref: "#/components/schemas/CompetitionCard" }
              stageNumber: { type: [integer, "null"] }
              place: { type: [integer, "null"] }
              placePoints: { type: number }
              bonusPoints: { type: number }
              counted: { type: boolean }
              reason: { type: string, examples: ["one of the last 3 completed", "current competition", "dropped: older"] }

    TeamsState:
      type: object
      description: Same shape as v1 GET /api/v1/teams/ (pair-choice page).
      required: [miniTournament, players, pairs, me]
      properties:
        miniTournament:
          type: object
          required: [id, number, pairingDeadline, pairingClosed, pairingOpen]
          properties:
            id: { type: integer, description: stage id }
            number: { type: integer }
            pairingDeadline: { type: [string, "null"], format: date-time }
            pairingClosed: { type: boolean }
            pairingOpen: { type: boolean }
        players:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/PlayerRef"
              - type: object
                required: [rankingPoints, rankingPosition, paired, allowedForMe]
                properties:
                  rankingPoints: { type: number }
                  rankingPosition: { type: [integer, "null"], description: null when unranked under the current rule }
                  paired: { type: boolean }
                  allowedForMe: { type: boolean }
        pairs:
          type: array
          items:
            type: object
            required: [id, source, players, rankingPoints]
            properties:
              id: { type: integer }
              source: { type: string, enum: [mutual, auto, admin], description: "formed_by mutual→mutual; ranking/draw/rotation→auto; manual→admin" }
              players: { type: array, items: { $ref: "#/components/schemas/PlayerRef" } }
              rankingPoints: { type: number }
        me:
          type: object
          required: [playerId, inRoster, myChoice, choseMe, pairId, isAdmin]
          properties:
            playerId: { type: [integer, "null"] }
            inRoster: { type: boolean }
            myChoice: { type: [integer, "null"] }
            choseMe: { type: array, items: { type: integer } }
            pairId: { type: [integer, "null"] }
            isAdmin: { type: boolean }

    Sponsor:
      type: object
      required: [id, name, website, clickUrl]
      properties:
        id: { type: integer }
        name: { type: string }
        website: { type: string, description: The sponsor's site }
        clickUrl: { type: string, description: "Relative URL of the click-counting redirect (/sponsors/sponsor_click/{id}); link here, not to website" }
        image: { oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }

    NewsSummary:
      type: object
      required: [id, title, author, latest, coverImage]
      properties:
        id: { type: integer }
        title: { type: string }
        author: { type: [string, "null"] }
        latest: { type: boolean }
        coverImage: { oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }

    NewsDetail:
      allOf:
        - $ref: "#/components/schemas/NewsSummary"
        - type: object
          required: [text]
          properties: { text: { type: string } }

    RankedPlayerRef:
      allOf:
        - $ref: "#/components/schemas/PlayerRef"
        - type: object
          required: [rankingPoints, rankingPosition]
          properties: { rankingPoints: { type: number }, rankingPosition: { type: [integer, "null"] } }

    TeamsPairProjection:
      type: object
      required: [seed, pairId, players, sum, formedBy, provisional, unpairedSlots, pending, mine]
      properties:
        seed: { type: integer, description: 1..4 within the division }
        pairId: { type: [integer, "null"] }
        players: { type: array, items: { $ref: "#/components/schemas/RankedPlayerRef" } }
        sum: { type: number }
        formedBy: { type: string, enum: [mutual, manual, ranking, extra] }
        provisional: { type: boolean }
        unpairedSlots: { type: [array, "null"], items: { type: integer } }
        pending: { type: array, items: { $ref: "#/components/schemas/TeamsDeclaration" } }
        mine: { type: boolean }

    TeamsDeclaration:
      type: object
      required: [from, to]
      properties: { from: { $ref: "#/components/schemas/PlayerRef" }, to: { $ref: "#/components/schemas/PlayerRef" } }

    TeamsDivisionProjection:
      type: object
      required: [tier, name, rating, minSum, maxSum, maxPlacePoints, maxBonusPoints, pairs]
      properties:
        tier: { type: integer }
        name: { type: string }
        rating: { type: number }
        minSum: { type: number }
        maxSum: { type: number }
        maxPlacePoints: { type: number }
        maxBonusPoints: { type: number }
        pairs: { type: array, items: { $ref: "#/components/schemas/TeamsPairProjection" } }

    TeamsProjection:
      type: object
      required: [stage, counts, pending, divisions]
      properties:
        stage:
          type: object
          required: [id, number, pairingDeadline, pairingOpen, pairingClosed]
          properties: { id: { type: integer }, number: { type: integer }, pairingDeadline: { type: [string, "null"], format: date-time }, pairingOpen: { type: boolean }, pairingClosed: { type: boolean } }
        counts:
          type: object
          required: [players, pairsTotal, pairsConfirmed, unpaired, pendingDeclarations]
          properties: { players: { type: integer }, pairsTotal: { type: integer }, pairsConfirmed: { type: integer }, unpaired: { type: integer }, pendingDeclarations: { type: integer } }
        pending: { type: array, items: { $ref: "#/components/schemas/TeamsDeclaration" } }
        divisions: { type: array, items: { $ref: "#/components/schemas/TeamsDivisionProjection" } }

    TeamsSimulation:
      allOf:
        - $ref: "#/components/schemas/TeamsProjection"
        - type: object
          required: [player, partner, locked, result, baseline, candidates]
          properties:
            player: { $ref: "#/components/schemas/PlayerRef" }
            partner: { oneOf: [{ $ref: "#/components/schemas/PlayerRef" }, { type: "null" }] }
            locked: { type: boolean }
            result:
              type: object
              required: [tier, seed, rating, maxPlacePoints, maxBonusPoints, partner, sum, sumBreakdown, gapUp, marginDown, playedTogether]
              properties:
                tier: { type: integer }
                seed: { type: integer }
                rating: { type: number }
                maxPlacePoints: { type: number }
                maxBonusPoints: { type: number }
                partner: { $ref: "#/components/schemas/RankedPlayerRef" }
                sum: { type: number }
                sumBreakdown: { type: array, items: { type: object, required: [player, points], properties: { player: { $ref: "#/components/schemas/PlayerRef" }, points: { type: number } } } }
                gapUp: { type: [number, "null"] }
                marginDown: { type: [number, "null"] }
                playedTogether: { type: array, items: { type: integer } }
            baseline:
              type: object
              required: [tier, seed, partner, sum]
              properties: { tier: { type: integer }, seed: { type: integer }, partner: { oneOf: [{ $ref: "#/components/schemas/PlayerRef" }, { type: "null" }] }, sum: { type: number } }
            candidates:
              type: array
              items:
                type: object
                required: [player, status, allowed, sum, tier, seed, delta, playedTogether]
                properties:
                  player: { $ref: "#/components/schemas/RankedPlayerRef" }
                  status: { type: string, enum: [free, confirmed, declaredYou, youDeclared] }
                  pairedWith: { oneOf: [{ $ref: "#/components/schemas/PlayerRef" }, { type: "null" }] }
                  allowed: { type: boolean }
                  sum: { type: number }
                  tier: { type: [integer, "null"] }
                  seed: { type: [integer, "null"] }
                  delta: { type: [integer, "null"], description: baseline tier − tier (positive = moves up) }
                  reason: { type: [string, "null"], description: Why the candidate is not allowed (Portuguese) }
                  playedTogether: { type: array, items: { type: integer } }

    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        playerId: { type: [integer, "null"] }
        isAdmin: { type: boolean, description: Deprecated; role in (admin, super_admin) }
        superAdmin: { type: boolean, description: Deprecated; role == super_admin }

    Tokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    Session:
      allOf:
        - $ref: "#/components/schemas/Tokens"
        - type: object
          required: [user]
          properties: { user: { $ref: "#/components/schemas/User" } }
