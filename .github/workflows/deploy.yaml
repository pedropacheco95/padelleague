name: Build and Deploy to GCE

on:
  push:
    branches:
      - master

# Deploys of the same target must not overlap: two merges seconds apart
# raced on the VM ("container name is already in use" while the other run
# was still removing it). Queue instead, and never cancel a running deploy.
concurrency:
  group: deploy-backend-gce
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Install Poetry
      run: pipx install poetry

    - name: Check lockfile is up-to-date
      run: poetry check --lock

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/porto-padel-league:latest
        platforms: linux/amd64

    - name: Copy .env.prod to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        source: ".env.prod"
        target: "/home/${{ secrets.GCE_USER }}/"
        overwrite: true

    - name: Deploy on GCE
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        script: |
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/porto-padel-league:latest
          sudo docker stop ppl || true && sudo docker rm ppl || true
          sudo docker run -d --name ppl -p 5000:80 \
            --env-file /home/${{ secrets.GCE_USER }}/.env.prod \
            -e POSTGRES_PW=${{ secrets.POSTGRES_PW }} \
            -e FLASK_SECRET_KEY=${{ secrets.FLASK_SECRET_KEY }} \
            -e MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }} \
            -e LLM_API_KEY=${{ secrets.LLM_API_KEY }} \
            -e GCS_UPLOADS_BUCKET=${{ secrets.GCS_UPLOADS_BUCKET }} \
            -e ALERT_EMAIL=${{ secrets.ALERT_EMAIL }} \
            -e CHATBOT_DATABASE_URI=${{ secrets.CHATBOT_DB_PASSWORD && format('postgresql://ppl_chatbot:{0}@172.17.0.1:5432/padel_league', secrets.CHATBOT_DB_PASSWORD) || '' }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/porto-padel-league:latest
          sudo docker image prune -f || true
          # db_backup.sh reads the DB password from here (no literal in the repo)
          (umask 077; printf 'PGPASSWORD=%s\n' '${{ secrets.POSTGRES_PW }}' > /home/${{ secrets.GCE_USER }}/.backup.env)

    - name: Copy cron scripts to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        source: "scripts/db_backup.sh,scripts/teams_tick.sh,scripts/disk_check.sh,scripts/weekly_cleanup.sh"
        target: "/home/${{ secrets.GCE_USER }}/"
        strip_components: 1
        overwrite: true

    - name: Copy the chatbot role SQL to VM
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        source: "docs/security/chatbot_readonly_role.sql"
        target: "/home/${{ secrets.GCE_USER }}/"
        strip_components: 2
        overwrite: true

    - name: Setup cron jobs
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.GCE_HOST }}
        username: ${{ secrets.GCE_USER }}
        key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
        script: |
          H=/home/${{ secrets.GCE_USER }}
          chmod +x $H/db_backup.sh $H/teams_tick.sh $H/disk_check.sh $H/weekly_cleanup.sh

          # db_backup.sh, not backup.sh: scp-action treats target as a directory, so the old
          # "Copy backup script" step left ~/backup.sh as a directory and its cron line ran nothing.
          # The grep also drops any older backup.sh line in this crontab.
          (crontab -l 2>/dev/null | grep -v -e backup.sh -e teams_tick.sh -e disk_check.sh -e weekly_cleanup.sh
           echo "0 3 * * * $H/db_backup.sh >> $H/db_backup.log 2>&1"
           echo "1 * * * * $H/teams_tick.sh"
           echo "30 7 * * * $H/disk_check.sh"
           echo "30 4 * * 0 $H/weekly_cleanup.sh") | crontab -

          # Read-only chatbot role (idempotent; skipped until the secret exists)
          if [ -n '${{ secrets.CHATBOT_DB_PASSWORD }}' ]; then
            sudo -u postgres psql -q -d padel_league -v chatbot_password='${{ secrets.CHATBOT_DB_PASSWORD }}' < $H/chatbot_readonly_role.sql
          fi
